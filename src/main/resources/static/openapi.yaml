openapi: 3.0.3
info:
  title: Payments Ledger Service
  version: 0.1.0
  contact:
    name: Stanley Sujith Nelavala
    url: https://github.com/consultantstanleymn
  description: >
    Double-entry ledger. All amounts are integers in minor units (cents).
    Every POST needs an Idempotency-Key header and an X-Api-Key header.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://127.0.0.1:18080
security:
  - ApiKey: []
tags:
  - name: Accounts
    description: Create accounts and read balances.
  - name: Transfers
    description: Move money between accounts.
  - name: Payments
    description: Authorize, capture, void and refund payments.
  - name: Reconciliation
    description: Compare captured payments with a settlement file.
paths:
  /accounts:
    post:
      operationId: createAccount
      summary: Create an account
      description: Creates an account with a currency and an optional minimum balance. The account starts with a zero balance.
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccount'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '422':
          $ref: '#/components/responses/Error'
  /accounts/{id}/balance:
    get:
      operationId: getBalance
      summary: Balance from the ledger
      description: Returns the balance computed from the ledger journal, which is the source of truth.
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/Error'
  /accounts/{id}/balance/projection:
    get:
      operationId: getProjection
      summary: Balance from the Kafka read model. It can lag the ledger.
      description: Returns the balance from the read model that is built from Kafka events. It can lag behind the ledger.
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projection'
        '404':
          $ref: '#/components/responses/Error'
  /transfers:
    post:
      operationId: createTransfer
      summary: Move money between two accounts
      description: Moves money between two accounts in one database transaction. Uses an Idempotency-Key so a retry never moves money twice.
      tags: [Transfers]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transfer'
      responses:
        '201':
          description: Transfer posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionId:
                    type: string
                    format: uuid
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /payments:
    post:
      operationId: authorizePayment
      summary: Authorize a payment (place a hold)
      description: Places a hold on the payer account for the payment amount. Uses an Idempotency-Key so a retry never creates a second hold.
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Authorize'
      responses:
        '201':
          description: Authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    get:
      operationId: getPaymentByExternalRef
      summary: Find a payment by the caller reference
      description: Returns the payment that carries this externalRef. Answers 404 when none exists.
      tags: [Payments]
      parameters:
        - name: externalRef
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/Error'
  /payments/{id}:
    get:
      operationId: getPayment
      summary: Read a payment
      description: Returns the current state of a payment and its amounts.
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/Error'
  /payments/{id}/capture:
    post:
      operationId: capturePayment
      summary: Capture an authorized payment, in full or in part
      description: Turns a hold into a posted transfer, in full or in part. The remaining hold is released.
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Amount'
      responses:
        '200':
          description: Captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /payments/{id}/void:
    post:
      operationId: voidPayment
      summary: Release the hold of an authorized payment
      description: Releases the hold of an authorized payment so the money is available again.
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '409':
          $ref: '#/components/responses/Error'
  /payments/{id}/refund:
    post:
      operationId: refundPayment
      summary: Refund part or all of a captured payment
      description: Returns part or all of a captured payment to the payer. The total refunded never exceeds the captured amount.
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Amount'
      responses:
        '200':
          description: Refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /reconciliations:
    post:
      operationId: runReconciliation
      summary: Compare captured payments with a settlement CSV (payment_id,amount_minor)
      description: Compares captured payments with a settlement CSV and stores a report of matched, missing and mismatched payments.
      tags: [Reconciliation]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '201':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconReport'
        '422':
          $ref: '#/components/responses/Error'
  /reconciliations/latest:
    get:
      operationId: latestReconciliation
      summary: Most recent report
      description: Returns the most recent reconciliation report.
      tags: [Reconciliation]
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconReport'
        '404':
          $ref: '#/components/responses/Error'
  /reconciliations/{id}:
    get:
      operationId: getReconciliation
      summary: One report
      description: Returns one reconciliation report by id.
      tags: [Reconciliation]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconReport'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    Amount:
      type: object
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 1
    CreateAccount:
      type: object
      required: [name, currency]
      properties:
        name:
          type: string
        currency:
          type: string
          example: USD
        floorMinor:
          type: integer
          format: int64
          maximum: 0
          description: Lowest allowed balance. Zero or negative.
    Account:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        currency:
          type: string
        floorMinor:
          type: integer
          format: int64
        postedMinor:
          type: integer
          format: int64
        heldMinor:
          type: integer
          format: int64
        availableMinor:
          type: integer
          format: int64
    Projection:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        postedMinor:
          type: integer
          format: int64
        heldMinor:
          type: integer
          format: int64
        eventCount:
          type: integer
          format: int64
    Transfer:
      type: object
      required: [fromAccountId, toAccountId, amountMinor]
      properties:
        fromAccountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
          minimum: 1
    Authorize:
      type: object
      required: [payerAccountId, payeeAccountId, amountMinor]
      properties:
        payerAccountId:
          type: string
          format: uuid
        payeeAccountId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        externalRef:
          type: string
          maxLength: 64
          description: Optional reference from the caller. Stored with the payment.
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        payerId:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        currency:
          type: string
        authorizedMinor:
          type: integer
          format: int64
        capturedMinor:
          type: integer
          format: int64
        refundedMinor:
          type: integer
          format: int64
        externalRef:
          type: string
          nullable: true
          description: Reference from the caller, or null.
        status:
          type: string
          enum: [AUTHORIZED, CAPTURED, VOIDED]
    ReconReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        matched:
          type: integer
        missing:
          type: integer
        mismatched:
          type: integer
        unexpected:
          type: integer
        details:
          type: string
          description: JSON text with the ids behind each count.
