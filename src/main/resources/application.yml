spring:
  application:
    name: payments-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:18432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:18092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      concurrency: 3
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
server:
  port: ${PORT:18080}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        ledger.projection.lag: true
      slo:
        # The 300 ms bucket must exist, so the latency SLI query (le="0.3") has data.
        http.server.requests: 300ms
        ledger.projection.lag: 1s,5s,30s
ledger:
  # Local development key only. Real deployments set LEDGER_API_KEYS_<key>. See SECURITY.md.
  api-keys:
    dev-key-local-only: dev
