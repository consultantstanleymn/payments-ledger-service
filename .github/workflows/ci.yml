name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: "build (unit, property, Spotless)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify -DskipITs

  integration:
    name: "integration (Testcontainers: Postgres and Redpanda)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify -Dspotless.check.skip=true

  trace-check:
    name: "trace-check (one trace across HTTP, JDBC and Kafka)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -DskipTests -Dspotless.check.skip=true package
      - run: scripts/fetch-otel-agent.sh
      - run: mkdir -p .data/otel && docker compose up -d --build
      - name: wait for the app
        run: |
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:18080/actuator/health && exit 0; sleep 3; done
          docker compose logs app | tail -50
          exit 1
      - run: scripts/trace-check.sh
      - if: failure()
        run: docker compose logs --tail=80

  k6-smoke:
    name: "k6-smoke (5 VUs, 30 s, invariants)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: grafana/setup-k6-action@v1
      - run: ./mvnw -B -DskipTests -Dspotless.check.skip=true package
      - run: scripts/fetch-otel-agent.sh
      - run: mkdir -p .data/otel && docker compose up -d --build
      - name: wait for the app
        run: |
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:18080/actuator/health && exit 0; sleep 3; done
          exit 1
      - name: k6 with SLO thresholds (p95 under 300 ms on transfers; a breach exits with 99)
        run: k6 run -e VUS=5 -e DURATION=30s load/ledger.js
      - name: Record the image digest
        run: |
          docker image inspect --format '{{index .RepoDigests 0}}' payments-ledger-service:local > image-digest.txt 2>/dev/null \
            || docker image inspect --format '{{.Id}}' payments-ledger-service:local > image-digest.txt
          cat image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
      - name: SQL invariants
        env:
          CONTAINER_CLI: docker
          CONTAINER: ledger-postgres-1
        run: scripts/invariants.sh

  promtool:
    name: "promtool (SLO alert rules)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD/observability/rules:/r:ro" --entrypoint promtool docker.io/prom/prometheus:v2.55.1 check rules /r/slo.rules.yml
      - run: docker run --rm -v "$PWD/observability/rules:/r:ro" --entrypoint promtool docker.io/prom/prometheus:v2.55.1 test rules /r/slo.rules.test.yml

  openapi-lint:
    name: "openapi-lint (Spectral)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @stoplight/spectral-cli@6.14.2 lint src/main/resources/static/openapi.yaml --fail-severity=warn
