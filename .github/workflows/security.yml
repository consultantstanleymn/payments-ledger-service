name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  sast:
    name: "sast (semgrep)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep
      - run: semgrep scan --config p/java --error --severity ERROR src

  secrets:
    name: "secrets (gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
      - run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  deps:
    name: "deps (trivy fs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  image:
    name: "image (trivy image)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -DskipTests -Dspotless.check.skip=true package
      - run: ./scripts/fetch-otel-agent.sh
      - run: docker build -t payments-ledger-service:local .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: payments-ledger-service:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  sbom:
    name: "sbom (CycloneDX)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-maven
          path: target/bom.json

  exceptions:
    name: "exceptions file check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_security_exceptions.py security/exceptions.json
