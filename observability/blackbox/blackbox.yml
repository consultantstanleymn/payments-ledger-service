modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: []
      method: GET
      fail_if_not_ssl: false
  http_console:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: []
      method: GET
      fail_if_not_ssl: false
      fail_if_body_not_matches_regexp:
        - "Payments Ledger Console"
