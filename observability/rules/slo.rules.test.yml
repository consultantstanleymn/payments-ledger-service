rule_files:
  - slo.rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
    - series: http_server_requests_seconds_count{uri="/transfers",method="POST",status="200"}
      values: 0+100x300
    - series: http_server_requests_seconds_count{uri="/transfers",method="POST",status="500"}
      values: 0+15x300
    alert_rule_test:
    - eval_time: 90m
      alertname: LedgerTransferAvailabilityBurnFast
      exp_alerts:
      - exp_labels:
          severity: page
        exp_annotations:
          summary: Availability error budget burns fast (factor 14.4, windows 1h and 5m)
          runbook_url: docs/engagement/RUNBOOK.md#availability-burn
  - interval: 1m
    input_series:
    - series: http_server_requests_seconds_count{uri="/transfers",method="POST",status="200"}
      values: 0+100x300
    - series: http_server_requests_seconds_count{uri="/transfers",method="POST",status="500"}
      values: 0+0x300
    alert_rule_test:
    - eval_time: 90m
      alertname: LedgerTransferAvailabilityBurnFast
      exp_alerts: []
  - interval: 1m
    input_series:
    - series: http_server_requests_seconds_count{uri="/transfers",method="POST",status="200"}
      values: 0+100x300
    - series: http_server_requests_seconds_count{uri="/transfers",method="POST",status="500"}
